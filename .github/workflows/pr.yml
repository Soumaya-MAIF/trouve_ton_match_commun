name: Validation des Pull Requests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test:
    name: Spring test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      # Label used pour accéder au conteneur de service
      db:
        # Image Docker Hub
        image: postgres
        # Fournir le mot de passe pour postgres
        env:
          POSTGRES_DB: app
          POSTGRES_USER: user
          POSTGRES_PASSWORD: securePassword
        # Définir les vérifications de santé pour attendre que postgres ait démarré
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: securePassword
        run: mvn clean test
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          # if-no-files-found: error
          retention-days: 1
          compression-level: 0

  lighthouseci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
 
      - name: Désactiver Nexus et forcer npm public
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "strict-ssl=false" >> ~/.npmrc
          npm config list
 
      - name: Supprimer éventuelles dépendances Nexus
        run: rm -rf node_modules package-lock.json
 
      - name: Installer les dépendances depuis npm public
        run: npm install --no-cache --prefer-online
 
      - name: Installer Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
 
      - name: Build project
        run: npm run build
 
      - name: Run Lighthouse CI
        run: lhci autorun

