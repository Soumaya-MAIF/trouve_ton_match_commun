services:
  front:
    image: registry.nocturlab.fr/dreamteam/trouve-ton-match-frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.ttm-front.rule=Host(`ttm-dreamteam.nocturlab.fr`)
      - traefik.http.services.ttm-front.loadbalancer.server.port=80
    networks:
      - back
      - traefik

  back:
    image: registry.nocturlab.fr/dreamteam/trouve-ton-match-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.ttm-back.rule=Host(`ttm-dreamteam.nocturlab.fr`) && Path(`/api`)
      - traefik.http.services.ttm-back.loadbalancer.server.port=8080
    networks:
      - back
      - front
      - traefik
    ports:
      - "8079:8080"
    environment:
      HOST: 0.0.0.0
      POSTGRES_HOST: db:5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttm_commun
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db
      - back

volumes:
  db_data:

networks:
  front:
  back:
  db:
  traefik:
    external: true
    name: traefik_default